name: "\U0001F4DD Documentation Change"
description: "Request an improvement to documentation"
title: "Docs: (fill in)"
labels:
    - documentation
body:
    - type: markdown
      attributes:
          value: By opening an issue, you agree to abide by the [OpenJS Foundation Code of Conduct](https://eslint.org/conduct).
    - type: textarea
      attributes:
          label: What documentation issue do you want to solve?
          description: |
              Please explain your issue in as much detail as possible.
      validations:
          required: true
    - type: textarea
      attributes:
          label: What do you think is the correct solution?
          description: |
              Please explain how you'd like to change the documentation for this project to address the problem.
      validations:
          required: true
    - type: checkboxes
      attributes:
          label: Participation
          options:
              - label: I am willing to submit a pull request for this change.
                required: false
    - type: markdown
      attributes:
          value: Please **do not** open a pull request until this issue has been accepted by the team.
    - type: checkboxes
      attributes:
          label: AI acknowledgment
          description: Check all that apply.
          options:
              - label: I did _not_ use AI to generate this issue
                required: false
              - label: I used AI to write or edit the description of this issue (including translation)
                required: false
              - label: I used AI to understand the codebase
                required: false
              - label: I used AI to write or edit code included in this issue _and_ I reviewed the code
                required: false
    - type: textarea
      attributes:
          label: Additional comments
          description: Is there anything else you'd like to mention?
